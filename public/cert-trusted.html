<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ami chat - setup check</title>
<style>
  /* Self-contained on purpose.
     This page is reached at the exact moment a user has just clicked through a
     certificate warning, so it must never depend on a stylesheet or script that
     the browser might still be refusing. No bootstrap, no fonts, no CDN. */
  :root {
    --primary: #6b2fb5;
    --primary-2: #8a4fd1;
    --ok: #1a7f4b;
    --ok-bg: #e8f6ee;
    --warn: #8a5a00;
    --warn-bg: #fdf3dd;
    --bad: #b3261e;
    --bad-bg: #fdeceb;
    --ink: #1c1b22;
    --ink-soft: #5b5766;
    --line: #e3e0ea;
    --bg: #f6f5f9;
    --card: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ok: #6ee7a8; --ok-bg: #10301f;
      --warn: #f5c563; --warn-bg: #33270c;
      --bad: #ff9d97; --bad-bg: #3a1512;
      --ink: #f2f0f7; --ink-soft: #a8a3b6;
      --line: #33303d; --bg: #16151b; --card: #201e27;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 560px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 32px;
    box-shadow: 0 10px 30px rgba(28, 27, 34, .08);
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    color: var(--primary);
    font-weight: 600;
    letter-spacing: .2px;
    margin-bottom: 22px;
  }
  .brand svg { width: 26px; height: 26px; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--ink-soft);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 4px 10px;
  }
  h1 { font-size: 24px; line-height: 1.25; margin: 16px 0 10px; }
  p { margin: 0 0 14px; color: var(--ink-soft); }
  code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px; background: rgba(107, 47, 181, .08);
    color: var(--ink); padding: 2px 6px; border-radius: 5px;
    word-break: break-all;
  }
  .status {
    display: flex; gap: 14px; align-items: flex-start;
    border-radius: 12px; padding: 16px; margin: 18px 0;
    border: 1px solid transparent;
  }
  .status[hidden] { display: none; }
  .status .mark {
    flex: 0 0 34px; height: 34px; border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700; line-height: 1;
  }
  .status h2 { font-size: 16px; margin: 4px 0 6px; }
  .status p { margin: 0; font-size: 14.5px; }
  .status-ok    { background: var(--ok-bg);   border-color: var(--ok);   color: var(--ok); }
  .status-warn  { background: var(--warn-bg); border-color: var(--warn); color: var(--warn); }
  .status-bad   { background: var(--bad-bg);  border-color: var(--bad);  color: var(--bad); }
  .status-ok h2, .status-warn h2, .status-bad h2 { color: inherit; }
  .status-ok p, .status-warn p, .status-bad p { color: var(--ink-soft); }
  ol { margin: 0; padding-left: 22px; color: var(--ink-soft); }
  ol li { margin-bottom: 8px; }
  ol li:last-child { margin-bottom: 0; }
  a { color: var(--primary); }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
  .btn {
    appearance: none; border: 1px solid transparent; cursor: pointer;
    font: inherit; font-weight: 600; text-decoration: none;
    padding: 11px 18px; border-radius: 10px; display: inline-flex;
    align-items: center; gap: 8px;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%);
    color: #fff; border: 0;
  }
  .btn-ghost { background: transparent; color: var(--ink-soft); border-color: var(--line); }
  .btn:focus-visible { outline: 3px solid var(--primary-2); outline-offset: 2px; }
  .btn[disabled] { opacity: .55; cursor: default; }
  .foot {
    margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line);
    font-size: 13px; color: var(--ink-soft);
  }
  @media (prefers-reduced-motion: no-preference) {
    .spin {
      width: 18px; height: 18px; border-radius: 999px;
      border: 2.5px solid var(--line); border-top-color: var(--primary);
      animation: sp .7s linear infinite;
    }
    @keyframes sp { to { transform: rotate(360deg); } }
  }
</style>
</head>
<body>
<main class="card">
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="4" y="8" width="16" height="12" rx="3"/>
      <path d="M12 8V4"/><circle cx="12" cy="4" r="1"/><path d="M9.5 13h5M9.5 16.5h3"/>
    </svg>
    Ami chat
  </div>

  <span class="badge" id="probe">Checking&hellip;</span>
  <h1 id="headline">Checking this browser</h1>

  <!-- The result region is polite-live so a screen reader announces the outcome
       when the probe resolves, instead of silently swapping content. -->
  <div id="result" role="status" aria-live="polite"></div>

  <div class="actions" id="actions" hidden>
    <button class="btn btn-primary" id="back" type="button">Back to the Helpdesk</button>
    <button class="btn btn-ghost" id="retry" type="button">Check again</button>
  </div>

  <p class="foot">
    This exemption is stored by your browser for <b>this computer and this browser only</b>.
    Nobody else is affected, and nothing outside the office network is exposed.
  </p>
</main>

<script>
(function () {
  'use strict';

  // Hardcoded to match AmiChatConfig.baseUrl and the help page's cert probe.
  // Deliberately absolute: this file is also reachable under the MIS-mounted
  // path, and a relative '/api/health' would resolve to a path the API never
  // serves from there. A 404 still proves TLS worked, but it would read as a
  // false alarm, so the origin is pinned instead.
  var ORIGIN = 'https://192.1.5.21:3000';
  var PROBE = ORIGIN + '/api/health';
  var TIMEOUT_MS = 5000;

  var elBadge = document.getElementById('probe');
  var elHead = document.getElementById('headline');
  var elResult = document.getElementById('result');
  var elActions = document.getElementById('actions');
  var btnBack = document.getElementById('back');
  var btnRetry = document.getElementById('retry');

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function render(kind, badge, headline, bodyHtml) {
    elBadge.textContent = badge;
    elHead.textContent = headline;
    elResult.innerHTML = '<div class="status status-' + kind + '">' +
      '<div class="mark" aria-hidden="true">' +
      (kind === 'ok' ? '&#10003;' : kind === 'bad' ? '!' : '?') +
      '</div><div><h2>' + esc(headline) + '</h2>' + bodyHtml + '</div></div>';
    elActions.hidden = false;
    // Move focus so keyboard and screen-reader users land on the outcome
    // rather than being left on a button that may no longer be the right one.
    btnBack.focus();
  }

  var STEPS =
    '<ol>' +
    '<li>Open <code>' + esc(ORIGIN) + '</code> in this same browser.</li>' +
    '<li>Expect a &ldquo;your connection is not private&rdquo; / &ldquo;not secure&rdquo; warning.</li>' +
    '<li>Choose <b>Advanced</b>, then <b>Proceed to 192.1.5.21 (unsafe)</b>. ' +
      'In Firefox or Safari the same option is called <b>Visit Website</b> or <b>Show Details &rarr; visit this website</b>.</li>' +
    '<li>Come back and press <b>Check again</b>.</li>' +
    '</ol>';

  function isTrusted() {
    if (typeof window.AbortController !== 'function') {
      return Promise.resolve(false);
    }
    if (typeof window.fetch !== 'function') {
      return Promise.resolve(false);
    }
    var ctrl = new AbortController();
    var timer = window.setTimeout(function () { ctrl.abort(); }, TIMEOUT_MS);
    return window.fetch(PROBE, {
      mode: 'cors',
      cache: 'no-store',
      signal: ctrl.signal
    }).then(function (res) {
      window.clearTimeout(timer);
      // Any resolved response means the TLS handshake completed and the
      // request reached the server - including a 503 raised while storage is
      // degraded, and including a 404 from a misconfigured deployment. Only a
      // rejection or a timeout means the certificate is still in the way.
      return { trusted: true, status: res.status };
    }, function () {
      window.clearTimeout(timer);
      return { trusted: false, status: 0 };
    });
  }

  function check() {
    elBadge.textContent = 'Checking\u2026';
    elHead.textContent = 'Checking this browser';
    elResult.innerHTML = '';
    elActions.hidden = true;

    return isTrusted().then(function (r) {
      if (r.trusted && r.status === 404) {
        // TLS is fine but the API is not where it should be. Saying "all done"
        // here would send the user back to a Helpdesk whose widget cannot
        // load, so this is called out separately.
        render('warn', 'Almost',
          'Certificate accepted, but the health check was not found',
          '<p>The browser now trusts <code>' + esc(ORIGIN) + '</code>, so the certificate step is done. ' +
          'However <code>/api/health</code> answered <b>404</b>, which usually means the server is running ' +
          'with a different <code>API_BASE</code> or is missing the dashboard build. Tell IT before reloading ' +
          'the Helpdesk - the chat button may still not appear.</p>');
        return;
      }

      if (r.trusted) {
        render('ok', 'Done', 'It\u2019s done, thank you',
          '<p>This browser now trusts <code>' + esc(ORIGIN) + '</code>, so the chat widget will load.</p>' +
          '<p><b>You can close this page now.</b> Go back to the Helpdesk and the chat button will be ' +
          'in the bottom-right corner.</p>');
        return;
      }

      render('bad', 'Not yet', 'This browser still does not trust the server',
        '<p>Nothing has gone wrong - the certificate warning just has not been dismissed yet. ' +
        'It has to be done once per computer, in the browser you use for the Helpdesk.</p>' +
        STEPS);
    });
  }

  btnRetry.addEventListener('click', function () {
    btnRetry.disabled = true;
    check().then(function () { btnRetry.disabled = false; });
  });

  btnBack.addEventListener('click', function () {
    // Coming from the Helpdesk means there is somewhere to go back to. Opened
    // cold there is not, so fall back to the tab-closing instruction instead of
    // dumping the user on a blank history entry.
    if (window.history.length > 1) { window.history.back(); }
    else { window.close(); }
  });

  check();
})();
</script>
</body>
</html>
